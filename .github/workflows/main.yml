name: Magento 2 Playwright Self Test

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref, workflow_dispatch'
        required: false
        default: ''

jobs:
  build-and-selftest:
    if: github.event_name == 'workflow_dispatch' || github.head_ref != 'gitlab-main'
    runs-on: ubuntu-latest

    environment: magento-playwright

    env:
      PLAYWRIGHT_BASE_URL: https://hyva-demo.elgentos.io/
      PLAYWRIGHT_PRODUCTION_URL: https://hyva-demo.elgentos.io/

      MAGENTO_ADMIN_SLUG: ${{ secrets.MAGENTO_ADMIN_SLUG }}
      MAGENTO_ADMIN_USERNAME: ${{ secrets.MAGENTO_ADMIN_USERNAME }}
      MAGENTO_ADMIN_PASSWORD: ${{ secrets.MAGENTO_ADMIN_PASSWORD }}

      MAGENTO_EXISTING_ACCOUNT_PASSWORD: ${{ secrets.MAGENTO_EXISTING_ACCOUNT_PASSWORD }}
      MAGENTO_EXISTING_ACCOUNT_CHANGED_PASSWORD: ${{ secrets.MAGENTO_EXISTING_ACCOUNT_CHANGED_PASSWORD }}

      CAPTCHA_BYPASS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Copy config files
        run: |
          cp playwright.config.example.ts playwright.config.ts
          cp tsconfig.example.json tsconfig.json

      - name: Check secret propagation
        shell: bash
        run: |
          for name in MAGENTO_ADMIN_USERNAME MAGENTO_ADMIN_PASSWORD MAGENTO_ADMIN_SLUG \
                      MAGENTO_EXISTING_ACCOUNT_PASSWORD MAGENTO_EXISTING_ACCOUNT_CHANGED_PASSWORD; do
            if [ -n "${!name:-}" ]; then echo "$name: SET"; else echo "$name: EMPTY"; fi
          done
          echo "event=${{ github.event_name }} fork=${{ github.event.pull_request.head.repo.fork }}"

      - name: Run Playwright tests
        run: |
            set -euo pipefail
            echo "Running testing suite (setup runs as project dependency)"
            npm install
            npx playwright install --with-deps
            npx playwright test --workers=4 --max-failures=1
        shell: bash
        env:
            CI: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
            name: test-results
            path: test-results
            retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # --ignore-scripts: the postinstall runs the interactive install.js
      # wizard, and build.js deletes tests/ when CI=true.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint:ci

      - name: Prettier
        run: npm run format:check
